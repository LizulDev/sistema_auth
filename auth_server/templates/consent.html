<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Consentimento — Servidor de Autorização</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 2rem; }
        main { max-width: 520px; margin: 2rem auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2rem; }
        h1 { margin-top: 0; color: #38bdf8; font-size: 1.4rem; }
        .badge { display: inline-block; background: #0369a1; color: #f0f9ff; padding: 0.2rem 0.6rem; border-radius: 999px; font-size: 0.78rem; margin-bottom: 0.75rem; }
        .user-box { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 0.85rem 1rem; margin: 1rem 0; }
        ul { padding-left: 1.25rem; line-height: 1.7; }
        code { background: #0f172a; padding: 0.1rem 0.35rem; border-radius: 4px; color: #a5f3fc; }
        .actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; }
        button { flex: 1; padding: 0.75rem; border-radius: 6px; border: none; font-weight: 600; font-size: 1rem; cursor: pointer; }
        .approve { background: #16a34a; color: #fff; }
        .deny { background: #475569; color: #f8fafc; }
    </style>
</head>
<body>
    <main>
        <span class="badge">Consentimento OAuth 2.0 / OIDC</span>
        <h1>Autorizar acesso?</h1>

        <div class="user-box">
            Autenticado como <strong>{{ user['full_name'] }}</strong> (<code>{{ user['username'] }}</code> — perfil <code>{{ user['role'] }}</code>)
        </div>

        <p>A aplicação <strong>{{ client_name }}</strong> solicita permissão para:</p>
        <ul>
            {% for scope in scopes %}
                <li><code>{{ scope.name }}</code>: {{ scope.description }}</li>
            {% endfor %}
        </ul>

        <form method="post" action="{{ url_for('op.authorize_post') }}">
            <input type="hidden" name="action" value="consent">
            <input type="hidden" name="auth_req_id" value="{{ auth_req_id }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="actions">
                <button type="submit" name="decision" value="approve" class="approve">Autorizar</button>
                <button type="submit" name="decision" value="deny" class="deny">Recusar</button>
            </div>
        </form>
    </main>
</body>
</html>
