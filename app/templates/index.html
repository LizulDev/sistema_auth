<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Autenticação e autorização</title>
</head>
<body>
    <main>
        <h1>Autenticação e autorização</h1>
        {% if user %}
            <p>Olá, {{ user['full_name'] }}.</p>
            {% if user['role'] == 'admin' %}
                <p><a href="{{ url_for('web.admin') }}">Área administrativa</a></p>
            {% endif %}
            <form method="post" action="{{ url_for('web.logout') }}">
                <input type="hidden" name="csrf_token" value="{{ user['csrf_token'] }}">
                <button type="submit">Sair</button>
            </form>
        {% elif configured %}
            <p><a href="{{ url_for('web.login') }}">Entrar</a></p>
        {% else %}
            <p>Configure o provedor OpenID Connect para iniciar o fluxo de login.</p>
        {% endif %}
    </main>
</body>
</html>
