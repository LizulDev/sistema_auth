<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erro de autorização</title>
    <style>
        body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 2rem; }
        main { max-width: 540px; margin: 2rem auto; background: #1e293b; border: 1px solid #ef4444; border-radius: 12px; padding: 2rem; }
        h1 { margin-top: 0; color: #f87171; font-size: 1.4rem; }
        code { background: #0f172a; padding: 0.15rem 0.45rem; border-radius: 4px; color: #fca5a5; }
    </style>
</head>
<body>
    <main>
        <h1>Requisição de autorização rejeitada</h1>
        <p><strong>Código:</strong> <code>{{ error }}</code></p>
        <p>{{ description }}</p>
        <p><small>Conforme RFC 6749 §4.1.2.1, o servidor não redireciona quando os parâmetros do cliente são inválidos.</small></p>
    </main>
</body>
</html>
